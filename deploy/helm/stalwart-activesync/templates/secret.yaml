{{- if not .Values.adminToken.existingSecret }}
{{- $name := include "stalwart-activesync.fullname" . }}
{{- $token := .Values.adminToken.value }}
{{- if not $token }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $old (index $old.data "admin-token") }}
{{- $token = index $old.data "admin-token" | b64dec }}
{{- else }}
{{- $token = randAlphaNum 40 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "stalwart-activesync.labels" . | nindent 4 }}
type: Opaque
data:
  admin-token: {{ $token | b64enc | quote }}
{{- end }}
