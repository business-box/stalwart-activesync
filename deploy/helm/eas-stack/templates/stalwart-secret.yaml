{{- if not .Values.stalwart.existingSecret }}
{{- $name := include "eas-stack.stalwart" . }}
{{- $pw := .Values.stalwart.adminPassword | default (include "eas-stack.keep" (dict "ns" .Release.Namespace "name" $name "key" "admin-password" "default" (randAlphaNum 32))) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "eas-stack.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password: {{ $pw | b64enc | quote }}
  recovery-admin: {{ printf "admin:%s" $pw | b64enc | quote }}
{{- end }}
