{{- $name := include "eas-stack.stalwart" . }}
{{- $m := .Values.stalwart.mailService }}
# Stalwart's plain HTTP listener: web UI, JMAP, DAV. Only the ingress and
# the gateway talk to it.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "eas-stack.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    {{- include "eas-stack.stalwartSelector" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-headless
  labels:
    {{- include "eas-stack.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    {{- include "eas-stack.stalwartSelector" . | nindent 4 }}
{{- if $m.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-mail
  labels:
    {{- include "eas-stack.labels" . | nindent 4 }}
  {{- with $m.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $m.type }}
  {{- if and (ne $m.type "ClusterIP") $m.externalTrafficPolicy }}
  externalTrafficPolicy: {{ $m.externalTrafficPolicy }}
  {{- end }}
  {{- with $m.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  ports:
    {{- range $m.ports }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .name }}
      protocol: TCP
      {{- with .nodePort }}
      nodePort: {{ . }}
      {{- end }}
    {{- end }}
  selector:
    {{- include "eas-stack.stalwartSelector" . | nindent 4 }}
{{- end }}
