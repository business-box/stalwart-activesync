[workspace]
resolver = "2"
members = [
    "crates/eas-wbxml",
    "crates/eas-proto",
    "crates/eas-jmap",
    "crates/eas-convert",
    "crates/eas-state",
    "crates/eas-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/business-box/stalwart-activesync"
rust-version = "1.80"

[workspace.dependencies]
eas-wbxml = { path = "crates/eas-wbxml" }
eas-proto = { path = "crates/eas-proto" }
eas-jmap = { path = "crates/eas-jmap" }
eas-convert = { path = "crates/eas-convert" }
eas-state = { path = "crates/eas-state" }
thiserror = "2"
serde_json = "1"
mail-parser = "0.11"
mail-builder = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
base64 = "0.22"
form_urlencoded = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
axum = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
codegen-units = 1
strip = true
